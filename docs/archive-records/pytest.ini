[pytest]
# F1-AI test_suite pytest 配置
testpaths = LabConsole/test_suite
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记声明
markers =
    unit: 纯逻辑单元测试，无 I/O 依赖
    integration: 集成测试，需要工具链完整安装
    requires_f1: 需要 F1.exe 真机，CI 默认跳过
    requires_dotnet: 需要 .NET 运行时
    real_machine: 需要真实机器/F1.exe 测试
    slow: 耗时较长的测试

# 默认跳过需要真机的测试（CI 环境）
addopts = -v --tb=short -m "not requires_f1 and not requires_dotnet"
